# Power Platform custom connector for Copilot Studio (Tools > Add a tool > New tool > Custom connector
# > Import OpenAPI file). Prefer the MCP onboarding wizard with "OAuth 2.0 > Dynamic discovery";
# use this file when your environment requires a custom connector (e.g. API-key access over a gateway).
swagger: '2.0'
info:
  title: Project Glasshaus
  description: >-
    Project management: search, create and update tasks and projects, link dependencies, log time,
    run reports and automations, and pull status-summary data.
  version: 0.7.0
host: glasshaus.example.com
basePath: /
schemes:
  - https
consumes: []
produces: []
paths:
  /mcp:
    post:
      summary: Project Glasshaus MCP server
      description: Glasshaus tools, resources and prompts over MCP Streamable HTTP.
      x-ms-agentic-protocol: mcp-streamable-1.0
      operationId: InvokeMCP
      responses:
        '200':
          description: Success
securityDefinitions:
  api_key:
    type: apiKey
    in: header
    name: Authorization
security:
  - api_key: []
