# Development overrides: expose Postgres/Redis on localhost for running api/web from source.
#   docker compose -p glasshaus-dev -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis  (or: make dev-deps)
services:
  postgres:
    ports: ["127.0.0.1:${GLASSHAUS_DEV_PG_PORT:-15432}:5432"]
  redis:
    ports: ["127.0.0.1:${GLASSHAUS_DEV_REDIS_PORT:-16379}:6379"]
  api:
    environment:
      GLASSHAUS_ENV: development
      GLASSHAUS_LOG_JSON: "false"
