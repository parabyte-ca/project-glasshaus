# Rendered by the nginx image's envsubst entrypoint (only ${GLASSHAUS_*} are substituted).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 50m;

    include /etc/nginx/snippets/security-headers.conf;

    # Resolve the API through Docker's DNS on each request (cached 10 s) instead of once at
    # start-up, so a recreated api container with a new address is found without restarting web.
    resolver ${GLASSHAUS_DNS_RESOLVER} valid=10s ipv6=off;

    # Behind another reverse proxy (Traefik, Caddy, a load balancer), set GLASSHAUS_UPSTREAM_PROXY to its
    # address or CIDR so the real client address is taken from its X-Forwarded-For. Anyone else's
    # X-Forwarded-For is ignored, and the API receives a single trusted address.
    set_real_ip_from ${GLASSHAUS_UPSTREAM_PROXY};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set $api_upstream ${GLASSHAUS_API_UPSTREAM};

    # Static files are compressed at build time (*.gz next to each file); API responses on the fly.
    # Safe against BREACH: the CSRF token travels only in a cookie and a header, never in a body.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/problem+json application/javascript text/css text/csv
               text/plain image/svg+xml application/manifest+json;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location ~ ^/(api|scim|healthz|readyz)(/|$) {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
