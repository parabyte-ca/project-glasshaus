# Rendered by the nginx image's envsubst entrypoint (only ${GLASSHAUS_*} are substituted).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 50m;

    include /etc/nginx/snippets/security-headers.conf;

    # Resolve the API through Docker's DNS on each request (cached 10 s) instead of once at
    # start-up, so a recreated api container with a new address is found without restarting web.
    resolver ${GLASSHAUS_DNS_RESOLVER} valid=10s ipv6=off;
    set $api_upstream ${GLASSHAUS_API_UPSTREAM};

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location ~ ^/(api|scim|healthz|readyz)(/|$) {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
