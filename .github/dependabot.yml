version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups: { python: { patterns: ["*"] } }
    ignore:
      # arq requires redis>=4.2,<6; newer majors make the lockfile unsolvable.
      - dependency-name: redis
        versions: [">=6"]
  - package-ecosystem: npm
    directories: [/frontend, /e2e]
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"] } }
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
