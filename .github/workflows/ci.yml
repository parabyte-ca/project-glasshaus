name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: glasshaus
          POSTGRES_PASSWORD: glasshaus
          POSTGRES_DB: glasshaus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U glasshaus" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      # Like production: the app connects as a least-privilege role (RLS enforced) that `migrate` creates.
      GLASSHAUS_DATABASE_URL: postgresql+asyncpg://glasshaus_app:app-ci-password@localhost:5432/glasshaus
      GLASSHAUS_MIGRATION_DATABASE_URL: postgresql+asyncpg://glasshaus:glasshaus@localhost:5432/glasshaus
      GLASSHAUS_REDIS_URL: redis://localhost:6379/0
      GLASSHAUS_INTEGRATION: "1"
      GLASSHAUS_ENV: test
      GLASSHAUS_SECRET_KEY: ci-only-secret-key-0123456789abcdef0123
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest
      - name: Migrations are in sync with models
        run: |
          uv run glasshaus migrate
          GLASSHAUS_DATABASE_URL="$GLASSHAUS_MIGRATION_DATABASE_URL" \
            uv run alembic -c src/glasshaus/migrations/alembic.ini check

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typed API client matches docs/openapi.json
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint -- --max-warnings 0
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  repo:
    name: Repo hygiene (shell, versions, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: shellcheck
        run: shellcheck -x setup.sh update.sh scripts/*.sh
      - name: Version consistency
        run: scripts/check-version.sh
      - name: Compose file is valid
        # Fill every empty secret so new required variables can't silently break this check again.
        run: cp .env.example .env && sed -i -E 's/^([A-Z_]*(PASSWORD|SECRET_KEY))=$/\1=x/' .env && docker compose config -q
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    name: Dependency and image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: pip-audit
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -q > requirements.txt
          uvx pip-audit -r requirements.txt --strict
      - name: npm audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  images:
    name: Container image scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: glasshaus, context: backend }
          - { name: glasshaus-web, context: frontend }
          - { name: glasshaus-backup, context: backup }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: scan/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
      - name: Trivy image scan (same gate as the release workflow)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan/${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  smoke:
    name: Stack smoke test (setup.sh)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: setup.sh from a clean clone
        run: ./setup.sh
      - name: Re-run is idempotent
        run: ./setup.sh
      - name: Endpoints respond
        run: |
          curl -fsS http://localhost:8471/readyz
          pw="$(grep ^GLASSHAUS_ADMIN_PASSWORD= .env | cut -d= -f2)"
          curl -fsS -c /tmp/jar -H 'content-type: application/json' \
            -d "{\"email\":\"admin@example.com\",\"password\":\"$pw\"}" http://localhost:8470/api/v1/auth/login
          curl -fsS -b /tmp/jar http://localhost:8470/api/v1/users/me
          curl -fsS http://localhost:8470/api/v1/version
          curl -fsS http://localhost:8470/ | grep -q "Project Glasshaus"
          curl -fsS http://localhost:8472/healthz
      - name: Backup and restore round-trip
        run: |
          dump="$(source scripts/lib.sh && backup_now ci)"
          # setup.sh created a backup key: dumps are encrypted and checksummed.
          [[ "$dump" == *.dump.age && -s "$dump.sha256" ]]
          if grep -q 'PGDMP' "$dump"; then echo 'dump is not encrypted'; exit 1; fi
          scripts/restore.sh "$dump" --yes
      - name: Restore drill
        run: |
          docker compose exec -T backup /bin/sh /scripts/restore-drill.sh
          grep -q '"ok": true' backups/drill-status.json
          curl -fsS -b /tmp/jar http://localhost:8470/api/v1/admin/backups | grep -q '"drill":{"finished_at"'
      - name: Upgrade with pre-flight check (same release)
        run: ./update.sh --no-git
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200

  e2e:
    name: End-to-end and accessibility (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack (fake AI provider for the assistant tests)
        run: |
          ./setup.sh
          echo GLASSHAUS_AI_PROVIDER=fake >> .env
          docker compose up -d --wait
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - working-directory: e2e
        run: |
          npm ci
          npm run typecheck
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: e2e
        run: E2E_ADMIN_PASSWORD="$(grep ^GLASSHAUS_ADMIN_PASSWORD= ../.env | cut -d= -f2)" npx playwright test
      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
