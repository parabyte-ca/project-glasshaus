[project]
name = "glasshaus"
version = "0.7.0"
description = "Project Glasshaus — self-hosted project management platform (API, worker, MCP server)"
authors = [
    { name = "Parabyte" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "faker>=40.41.0",
    "fastapi>=0.142.4",
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "orjson>=3.13.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "redis>=5",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
glasshaus = "glasshaus.cli:main"
glasshaus-mcp = "glasshaus.mcp_server.__main__:main"

[tool.uv.build-backend]
module-name = "glasshaus"
source-include = ["src/glasshaus/migrations/alembic.ini", "src/glasshaus/migrations/script.py.mako"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF", "ASYNC", "BLE", "PT"]
ignore = ["S101", "N818"]  # N818: domain error names (NotFound, Conflict) read better without "Error"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "PT018", "E501"]
"src/glasshaus/migrations/versions/**" = ["E501", "RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["src/glasshaus/migrations/versions/"]

[[tool.mypy.overrides]]
# Tool adapters return the JSON-ready result of runtime.invoke.
module = ["glasshaus.mcp_server.tools_core", "glasshaus.mcp_server.tools_plan"]
warn_return_any = false

[[tool.mypy.overrides]]
module = ["arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and Redis (GLASSHAUS_DATABASE_URL / GLASSHAUS_REDIS_URL)"]
